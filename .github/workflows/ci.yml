name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATA_MODE: mock
          NEXT_TELEMETRY_DISABLED: "1"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and lint
        run: |
          bash -n setup.sh deploy/deploy.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning setup.sh deploy/deploy.sh || true
